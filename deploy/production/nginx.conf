map $uri $nightcap_cache {
    default "no-cache";
    / "private, no-store, no-transform";
    /index.html "private, no-store, no-transform";
    ~^/site-assets/ "private, no-store, no-transform";
    /channel.json "no-store";
    ~^/release/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name play.nightcapgame.org;
    root /srv/public;
    server_tokens off;
    autoindex off;
    gzip off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $nightcap_cache always;
    location = /channel.json {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location /release/ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = / {
        root /srv/public/player-site/current;
        try_files /index.html =404;
    }
    location /site-assets/ {
        root /srv/public/player-site/current;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    # Storage aliases must not bypass the website response policy.
    location = /player-site { return 404; }
    location ^~ /player-site/ { return 404; }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}

# Only the approved-player hostname serves content. Other hosts fail closed.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    return 404;
}
