name: nightcap-production

x-runtime: &runtime
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    <<: *runtime
    image: ${MARIADB_IMAGE:?Set a reviewed MariaDB image digest}
    environment:
      MARIADB_DATABASE: peq
      MARIADB_USER: nightcap
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password, db_backup_config]
    volumes: [database:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g

  game:
    <<: *runtime
    image: ${NIGHTCAP_GAME_IMAGE:?Build and select the reviewed Nightcap runtime image}
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    working_dir: /srv/nightcap
    entrypoint: [python3, /opt/nightcap/start.py]
    environment: {NIGHTCAP_ZONE_WORKERS: "12"}
    volumes:
      - ./data/server:/srv/nightcap
      - ./private/eqemu_config.json:/srv/nightcap/eqemu_config.json:ro
      - ./private/login.json:/srv/nightcap/login.json:ro
    networks: [database, game]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python3, /opt/nightcap/start.py, --health]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    mem_limit: 4500m
    pids_limit: 512
    stop_grace_period: 90s

  gateway:
    <<: *runtime
    image: ${NIGHTCAP_GATEWAY_IMAGE:?Build and select the reviewed gateway image}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: 192MiB
      GAME_TARGET: game
      TRUSTED_PROXIES: 10.88.1.2/32
      PLAYER_ACCESS_FILE: /run/nightcap-access/credentials.json
      DENY_CIDRS: ${DENY_CIDRS:-}
    volumes:
      - ./private/player-access:/run/nightcap-access:ro
    networks:
      edge: {ipv4_address: 10.88.1.3}
      game: {}
    depends_on: {game: {condition: service_healthy}}
    mem_limit: 256m
    pids_limit: 64

  web:
    <<: *runtime
    image: ${NGINX_IMAGE:?Set a reviewed nginx unprivileged image digest}
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/public:/srv/public:ro
    networks:
      edge: {ipv4_address: 10.88.1.4}
    mem_limit: 64m
    pids_limit: 64

  tunnel:
    <<: *runtime
    image: ${CLOUDFLARED_IMAGE:?Set a reviewed cloudflared image digest}
    user: "65532:65532"
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    read_only: true
    cap_drop: [ALL]
    networks:
      edge: {ipv4_address: 10.88.1.2}
      outbound: {}
    depends_on: [web, gateway]
    mem_limit: 192m
    pids_limit: 128

# No service publishes a host port. Only cloudflared has an outbound network.
networks:
  database: {internal: true}
  game: {internal: true}
  edge:
    internal: true
    ipam:
      config: [{subnet: 10.88.1.0/29}]
  outbound: {}
volumes:
  database: {}
secrets:
  db_password: {file: ./private/db_password}
  db_root_password: {file: ./private/db_root_password}
  db_backup_config: {file: ./private/db_backup.cnf}
  tunnel_token: {file: ./private/tunnel_token}
