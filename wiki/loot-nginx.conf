# Insert inside the existing wiki server block only, before its catch-all route.
# Public projection only. Raw captures, manifests and other file types are denied.
location ~ "^/loot-data/(current/index\.json|[a-f0-9]{16}/(?:index\.json|item-[1-9][0-9]{0,6}\.json))$" {
    limit_except GET { deny all; }
    default_type application/json;
    gzip_static always;
    gunzip on;
    gzip_vary on;
    alias /srv/public/wiki-data/$1;
}
