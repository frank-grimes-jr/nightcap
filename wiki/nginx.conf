# Append as a distinct host to the existing approved-player web configuration.
# This root contains only the generated wiki package, never the parent public tree.
server {
    listen 8080;
    server_name wiki.nightcapgame.org;
    root /srv/public/wiki/current;
    server_tokens off;
    autoindex off;
    gzip off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=300, no-transform" always;
    error_page 404 /404.html;
    location = / { limit_except GET { deny all; } try_files /index.html =404; }
    location ~ ^/[a-z0-9-]+\.html$ { limit_except GET { deny all; } try_files $uri =404; }
    location ~ ^/assets/(wiki\.css|search\.js|moon\.svg|traders-at-dusk\.png)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /search-index.json { limit_except GET { deny all; } try_files $uri =404; }
    location = /sitemap.xml { limit_except GET { deny all; } try_files $uri =404; }
    location = /robots.txt { limit_except GET { deny all; } try_files $uri =404; }
    location / { return 404; }
}
